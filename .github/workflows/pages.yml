# Deploy the `gh-pages` branch's contents to GitHub Pages.
#
# Why this workflow exists instead of using Pages' "branch source" mode:
# the legacy branch-source builder choked on the gh-pages branch (every
# build just reported "Page build failed" with no further detail, even
# with .nojekyll committed). Switching Pages to the Actions-based source
# uploads gh-pages's files directly as a Pages artifact, no Jekyll round
# trip required.
#
# Trigger: any push to gh-pages (which is how `build-app.sh --release`
# updates the appcast). Also exposed as workflow_dispatch for manual
# re-runs.
name: Deploy gh-pages to Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      # Pin to the *previous* major (v4 of configure-pages, v3 of upload,
      # v4 of deploy). The v5 family's resolved SHAs were 404'ing on the
      # Actions runner mirror at codeload — pinning to known-cached
      # older SHAs sidesteps the issue. Bump back up when the mirror
      # catches up.
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d   # v4.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
