# Deploy the `gh-pages` branch's contents to GitHub Pages — MANUAL re-run.
#
# Why this workflow exists instead of using Pages' "branch source" mode:
# the legacy branch-source builder choked on the gh-pages branch (every
# build just reported "Page build failed" with no further detail, even
# with .nojekyll committed). Switching Pages to the Actions-based source
# uploads gh-pages's files directly as a Pages artifact, no Jekyll round
# trip required.
#
# Trigger: workflow_dispatch only. The AUTO-deploy on push lives in the
# identical copy of this file on the `gh-pages` branch — `push` events
# only run workflows defined in the *pushed* branch's tree, so a `push:
# branches: [gh-pages]` trigger here on `main` never fired (W-268). This
# main copy is kept purely as a convenient default-branch manual re-run:
# `gh workflow run pages.yml`. Edit both copies together if the deploy
# job ever changes.
name: Deploy gh-pages to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: gh-pages
      # actions/configure-pages was 404'ing from the runner's codeload
      # mirror for every pinned SHA (other actions on the same runner
      # downloaded fine), so it's intentionally omitted. configure-pages
      # is only required when you need its `base_url` output or when
      # generating Jekyll config — for a plain static-file upload it's
      # optional. Add it back when GitHub's mirror catches up.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
